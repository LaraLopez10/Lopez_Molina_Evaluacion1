<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Virtual</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">

  <h1 class="text-center mb-4">
    Biblioteca Virtual
  </h1>

  <div class="mb-4">
    <input type="number" id="buscarId" class="form-control mb-2" placeholder="Buscar por ID">

    <button class="btn btn-primary" onclick="buscarLibro()">
      Buscar
    </button>

    <button class="btn btn-secondary" onclick="getLibros()">
      Ver todos
    </button>
  </div>

  <div id="libros" class="row"></div>

<button
    class="btn btn-success"
    onclick="irADevoluciones()">

    Ver Préstamos y Devoluciones

</button>

<div class="card shadow-lg mt-5 border-0">

    <div class="card-header bg-success text-white">

        <h3 class="mb-0">
            Cargar Nuevo Libro
        </h3>

    </div>

    <div class="card-body">

        <form onsubmit="cargarLibro(event)">

            <div class="mb-3">

                <label class="form-label">
                    Título
                </label>

                <input
                    type="text"
                    id="titulo"
                    class="form-control"
                    placeholder="Ingrese el título"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Autor
                </label>

                <input
                    type="text"
                    id="autor"
                    class="form-control"
                    placeholder="Ingrese el autor"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Stock
                </label>

                <input
                    type="number"
                    id="stock"
                    class="form-control"
                    placeholder="Cantidad disponible">

            </div>

            <button
                type="submit"
                class="btn btn-success w-100">

                Guardar Libro

            </button>

        </form>

    </div>

</div>

</div>

<script src="/Views/funciones.js"></script>

</body>
</html>
