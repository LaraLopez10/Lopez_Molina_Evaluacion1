<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Virtual</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

  <h1 class="text-center mb-4">
    Biblioteca Virtual
  </h1>

  <div class="mb-4">
    <input type="number" id="buscarId" class="form-control mb-2" placeholder="Buscar por ID">

    <button class="btn btn-primary" onclick="buscarLibro()">
      Buscar
    </button>

    <button class="btn btn-secondary" onclick="getLibros()">
      Ver todos
    </button>
  </div>

  <div id="libros" class="row"></div>

  <h3 class="mt-4">
    Cargar Libro
  </h3>

  <form onsubmit="cargarLibro(event)">

    <input
      type="text"
      id="titulo"
      class="form-control mb-2"
      placeholder="Título"
      required>

    <input
      type="text"
      id="autor"
      class="form-control mb-2"
      placeholder="Autor"
      required>

    <input
      type="number"
      id="stock"
      class="form-control mb-2"
      placeholder="Stock">

    <button type="submit" class="btn btn-success">
      Guardar
    </button>

  </form>

</div>

<script src="/Views/funciones.js"></script>

</body>
</html>
